name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          code_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*@version[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' passwd.php)"
          if [[ "$TAG" != "v${code_version}" ]]; then
            echo "Tag ${TAG} does not match passwd.php version ${code_version}." >&2
            exit 1
          fi

          notes_file=".github/releases/${TAG}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tag ${TAG} is not contained in main." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run release checks
        run: |
          set -euo pipefail
          php -l passwd.php
          php tests/test_password.php
          node tests/test_strength.js
          node tests/test_frontend.js
          bash tests/test_http.sh
          bash tests/test_release_metadata.sh

      - name: Create or synchronize Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "安全密码生成器 $TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "安全密码生成器 $TAG" \
              --notes-file "$NOTES_FILE"
          fi
